name: renovation

services:
  reno:
    image: ghcr.io/baoxinwen/renovation:latest
    build: .
    container_name: renovation
    restart: unless-stopped
    ports:
      - "${PORT:-5174}:5174"
    environment:
      - NODE_ENV=production
      - SQLITE_JOURNAL_MODE=DELETE
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/api/settings').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
