name: renovation

services:
  reno:
    image: ghcr.io/baoxinwen/renovation:latest
    build: .
    container_name: renovation
    restart: unless-stopped
    ports:
      - "${PORT:-5174}:5174"
    environment:
      - NODE_ENV=production
      - SQLITE_JOURNAL_MODE=DELETE
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/api/settings').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backup:
    image: alpine:3.20
    container_name: renovation-backup
    restart: unless-stopped
    depends_on:
      reno:
        condition: service_healthy
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
      - ./docker/backup.sh:/app/backup.sh:ro
    entrypoint: ["/bin/sh", "/app/backup.sh", "schedule"]
    environment:
      - KEEP=30
