name: renovation-expenses

services:
  app:
    image: ghcr.io/baoxinwen/renovation-expenses:latest
    build: .
    container_name: renovation-expenses
    restart: unless-stopped
    ports:
      - "${PORT:-5174}:5174"
    environment:
      - NODE_ENV=production
      - SQLITE_JOURNAL_MODE=DELETE
      # .env 里的变量只用于本文件插值，不会自动进容器——README 承诺的
      # EXTRA_ALLOWED_HOSTS（NAS 主机名放行）必须在此显式透传
      - EXTRA_ALLOWED_HOSTS=${EXTRA_ALLOWED_HOSTS:-}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/api/settings').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
